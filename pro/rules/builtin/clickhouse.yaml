# -*- coding: utf-8 -*-
# ClickHouse 列式 OLAP 巡检规则（db_types: [clickhouse]）
# 条件引用的上下文标量由 plugins/available/clickhouse_jdbc/main_plugin.py::_build_rule_scalars
# 从 §3.2 的 clickhouse_* list[dict] 派生：
#   clickhouse_settings_map          : {参数名(大写): 值} 来自 system.settings
#   clickhouse_parts_max_count       : 单表最大 part 数
#   clickhouse_future_parts_total    : 复制未来 part 总数（复制积压）
#   clickhouse_replicas_max_delay     : 复制最大延迟（秒）
#   clickhouse_replicas_readonly_count: 只读副本数
#   clickhouse_mutations_stuck_count  : 未完成 mutations 数
#   clickhouse_disks_max_used_pct     : 磁盘最大使用率(%)
#   clickhouse_exception_count        : 近 24h 异常数
#   clickhouse_slow_query_count       : 近 24h 慢查询数(>5s)
#   clickhouse_merges_active_count    : 正在进行的后台合并数
#   clickhouse_tables_count           : 表数量
#   clickhouse_shard_count            : 集群分片数（去重）
# 设计原则：
#   - 数值缺失或非数字时解析为 None，条件用 `x is not None and x < N` 保护，
#     绝不抛异常，最多不命中。
#   - 缺失上下文键时规则引擎返回 None，整体降级为不命中，不影响巡检。
rules:
  # ───────────────────────── 复制健康 ─────────────────────────
  - id: ch_replica_readonly
    name: 存在只读副本
    name_zh: 存在只读副本
    category: replication
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 副本处于只读状态（is_readonly=1），复制链路异常
    description_zh: 副本处于只读状态（is_readonly=1），复制链路异常或 Leader 切换中
    condition: "ro_cnt is not None and ro_cnt > 0"
    params:
      ro_cnt: "${context.clickhouse_replicas_readonly_count}"
    message: "检测到 {ro_cnt} 个副本处于只读状态，复制可能中断或 Leader 正在切换"
    message_zh: "检测到 {ro_cnt} 个副本处于只读状态，复制可能中断或 Leader 正在切换"
    fix_sql: "-- 检查副本 ZooKeeper 连接与 replicated 表定义；恢复后副本自动退出只读"

  - id: ch_replica_delay_high
    name: 复制延迟过高
    name_zh: 复制延迟过高
    category: replication
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 复制绝对延迟超过 60 秒，主副本数据同步严重滞后
    description_zh: 复制绝对延迟（absolute_delay）超过 60 秒
    condition: "delay is not None and delay > 60"
    params:
      delay: "${context.clickhouse_replicas_max_delay}"
    message: "复制最大延迟为 {delay:.0f} 秒，超过 60 秒阈值，查询可能读到过期数据"
    message_zh: "复制最大延迟为 {delay:.0f} 秒，超过 60 秒阈值，查询可能读到过期数据"
    fix_sql: "-- 排查 ZooKeeper 延迟、网络与写入峰值；必要时调整 insert_quorum"

  - id: ch_future_parts_high
    name: 复制未来 part 堆积
    name_zh: 复制未来 part 堆积
    category: replication
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 未来 part（future_parts）总数过高，复制队列积压
    description_zh: future_parts 总数超过 1000，复制队列积压
    condition: "fp is not None and fp > 1000"
    params:
      fp: "${context.clickhouse_future_parts_total}"
    message: "复制未来 part 总数为 {fp}，复制队列存在明显积压"
    message_zh: "复制未来 part 总数为 {fp}，复制队列存在明显积压"
    fix_sql: "-- 检查 ZooKeeper 写入压力与副本可用性，降低写入峰值"

  # ───────────────────────── 存储 / Parts ─────────────────────────
  - id: ch_disk_high
    name: 磁盘使用率过高
    name_zh: 磁盘使用率过高
    category: storage
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 磁盘使用率超过 90%，存在写入失败风险
    description_zh: 任一磁盘使用率超过 90%
    condition: "dp is not None and dp > 90"
    params:
      dp: "${context.clickhouse_disks_max_used_pct}"
    message: "磁盘最大使用率为 {dp:.1f}%，超过 90% 可能导致 part 写入失败、查询报错"
    message_zh: "磁盘最大使用率为 {dp:.1f}%，超过 90% 可能导致 part 写入失败、查询报错"
    fix_sql: "-- 清理过期分区 / 扩容磁盘 / 调整 TTL；监控 clickhouse_disks 水位"

  - id: ch_disk_medium
    name: 磁盘使用率预警
    name_zh: 磁盘使用率预警
    category: storage
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 磁盘使用率超过 80%
    description_zh: 任一磁盘使用率超过 80%
    condition: "dpm is not None and dpm > 80 and dpm <= 90"
    params:
      dpm: "${context.clickhouse_disks_max_used_pct}"
    message: "磁盘最大使用率为 {dpm:.1f}%，建议关注并规划扩容"
    message_zh: "磁盘最大使用率为 {dpm:.1f}%，建议关注并规划扩容"
    fix_sql: "-- 规划磁盘扩容 / 数据归档 / 评估 TTL 清理策略"

  - id: ch_parts_explosion
    name: Part 数量爆炸
    name_zh: Part 数量爆炸
    category: storage
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 单表 active part 数超过 10000，合并不及时会拖慢查询
    description_zh: 单表 active part 数超过 10000（part 爆炸）
    condition: "pc is not None and pc > 10000"
    params:
      pc: "${context.clickhouse_parts_max_count}"
    message: "单表最大 part 数为 {pc}，存在 part 爆炸，查询需扫描大量小 part 导致性能骤降"
    message_zh: "单表最大 part 数为 {pc}，存在 part 爆炸，查询需扫描大量小 part 导致性能骤降"
    fix_sql: "-- 调大分区粒度 / 增大写入批大小 / 提升 background_pool_size；必要时 OPTIMIZE TABLE FINAL"

  - id: ch_parts_warning
    name: Part 数量偏多
    name_zh: Part 数量偏多
    category: storage
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 单表 active part 数超过 3000
    description_zh: 单表 active part 数超过 3000
    condition: "pcw is not None and pcw > 3000 and pcw <= 10000"
    params:
      pcw: "${context.clickhouse_parts_max_count}"
    message: "单表最大 part 数为 {pcw}，建议关注合并效率，避免进一步膨胀"
    message_zh: "单表最大 part 数为 {pcw}，建议关注合并效率，避免进一步膨胀"
    fix_sql: "-- 评估写入模式与分区策略，适当合并小 part"

  # ───────────────────────── 合并 / Mutations ─────────────────────────
  - id: ch_merges_high
    name: 后台合并压力偏高
    name_zh: 后台合并压力偏高
    category: merge
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 正在进行的后台合并数超过 50，写入放大或合并滞后
    description_zh: 正在进行的后台合并数超过 50
    condition: "mc is not None and mc > 50"
    params:
      mc: "${context.clickhouse_merges_active_count}"
    message: "当前后台合并数为 {mc}，合并压力偏高，可能影响写入吞吐"
    message_zh: "当前后台合并数为 {mc}，合并压力偏高，可能影响写入吞吐"
    fix_sql: "-- 检查写入峰值与磁盘 IO；适当调大 background_pool_size"

  - id: ch_mutations_stuck
    name: Mutations 卡住
    name_zh: Mutations 卡住
    category: mutation
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 存在未完成的 ALTER TABLE ... UPDATE/DELETE（mutations），可能卡住或失败
    description_zh: 存在未完成（is_done=0）的 mutations
    condition: "ms is not None and ms > 0"
    params:
      ms: "${context.clickhouse_mutations_stuck_count}"
    message: "检测到 {ms} 个未完成的 mutations，可能阻塞表元数据或长时间占用资源"
    message_zh: "检测到 {ms} 个未完成的 mutations，可能阻塞表元数据或长时间占用资源"
    fix_sql: "-- 通过 system.mutations 查看 latest_fail_reason；必要时 KILL MUTATION"

  # ───────────────────────── 资源 / 参数 ─────────────────────────
  - id: ch_max_memory_unlimited
    name: 单查询内存未限制
    name_zh: 单查询内存未限制
    category: resource
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: max_memory_usage=0 表示单查询不限制内存，存在 OOM 风险
    description_zh: max_memory_usage 为 0（不限制单查询内存）
    condition: "mm is not None and _int(mm) == 0"
    params:
      mm: "${context.clickhouse_settings_map.get('MAX_MEMORY_USAGE')}"
    message: "max_memory_usage={mm}，单查询内存不限制，恶查询可拖垮整实例"
    message_zh: "max_memory_usage={mm}，单查询内存不限制，恶查询可拖垮整实例"
    fix_sql: "SET max_memory_usage = 4000000000;  -- 建议设为物理内存 50%（示例 4GB，请按实际内存调整）"

  - id: ch_server_memory_unlimited
    name: 服务端内存未限制
    name_zh: 服务端内存未限制
    category: resource
    db_types: [clickhouse]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: max_memory_usage_for_all_queries=0 表示全局查询内存不限制，易 OOM 被 OS kill
    description_zh: max_memory_usage_for_all_queries 为 0（不限制全局查询内存）
    condition: "sm is not None and _int(sm) == 0"
    params:
      sm: "${context.clickhouse_settings_map.get('MAX_MEMORY_USAGE_FOR_ALL_QUERIES')}"
    message: "max_memory_usage_for_all_queries={sm}，进程内存不限制，存在被 OOM Killer 终止风险"
    message_zh: "max_memory_usage_for_all_queries={sm}，进程内存不限制，存在被 OOM Killer 终止风险"
    fix_sql: "SET max_memory_usage_for_all_queries = 8000000000;  -- 建议设为物理内存 80%（示例 8GB，请按实际内存调整）"

  - id: ch_background_pool_low
    name: 后台合并线程池偏小
    name_zh: 后台合并线程池偏小
    category: resource
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: background_pool_size < 8 会导致合并/突变并发不足、part 膨胀
    description_zh: background_pool_size 小于 8
    condition: "bp is not None and _int(bp) < 8"
    params:
      bp: "${context.clickhouse_settings_map.get('BACKGROUND_POOL_SIZE')}"
    message: "background_pool_size={bp}，后台合并线程池偏小，易产生 part 爆炸"
    message_zh: "background_pool_size={bp}，后台合并线程池偏小，易产生 part 爆炸"
    fix_sql: "SET background_pool_size = 16;  -- 建议为物理核数或 2 倍"

  - id: ch_max_concurrent_low
    name: 最大并发查询偏低
    name_zh: 最大并发查询偏低
    category: resource
    db_types: [clickhouse]
    severity: low
    priority: low
    owner: DBA
    enabled: true
    description: max_concurrent_queries < 100 高并发时新查询被拒
    description_zh: max_concurrent_queries 小于 100
    condition: "cc is not None and _int(cc) < 100"
    params:
      cc: "${context.clickhouse_settings_map.get('MAX_CONCURRENT_QUERIES')}"
    message: "max_concurrent_queries={cc}，并发上限偏低，峰值期查询可能被拒绝"
    message_zh: "max_concurrent_queries={cc}，并发上限偏低，峰值期查询可能被拒绝"
    fix_sql: "SET max_concurrent_queries = 200;  -- 按业务并发评估"

  # ───────────────────────── 查询治理 ─────────────────────────
  - id: ch_slow_query_many
    name: 慢查询较多
    name_zh: 慢查询较多
    category: query
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 近 24 小时慢查询（>5s）数超过 50
    description_zh: 近 24 小时慢查询（>5 秒）数超过 50
    condition: "sq is not None and sq > 50"
    params:
      sq: "${context.clickhouse_slow_query_count}"
    message: "近 24 小时慢查询数为 {sq}，建议结合 query_log 优化 TOP SQL"
    message_zh: "近 24 小时慢查询数为 {sq}，建议结合 query_log 优化 TOP SQL"
    fix_sql: "-- 分析 system.query_log 中 query_duration_ms 排序的语句，加索引/改写/调参"

  - id: ch_exception_many
    name: 查询异常较多
    name_zh: 查询异常较多
    category: query
    db_types: [clickhouse]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 近 24 小时异常（type=Exception）数超过 100
    description_zh: 近 24 小时异常数超过 100
    condition: "ec is not None and ec > 100"
    params:
      ec: "${context.clickhouse_exception_count}"
    message: "近 24 小时查询异常数为 {ec}，建议排查失败原因（权限/语法/资源）"
    message_zh: "近 24 小时查询异常数为 {ec}，建议排查失败原因（权限/语法/资源）"
    fix_sql: "-- 通过 system.query_log WHERE type='Exception' 定位异常码与 SQL"
