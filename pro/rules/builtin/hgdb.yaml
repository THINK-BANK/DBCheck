# -*- coding: utf-8 -*-
# HGDB（瀚高数据库，PostgreSQL 兼容系）规则引擎规则文件
#
# 设计说明：
# - HGDB V9 基于 PostgreSQL 14 内核（版本串标明 PG 14.20 兼容），运行时参数通过 SHOW
#   获取，系统视图为标准 PG 系统目录（pg_catalog.* / pg_stat_* / pg_settings 等），
#   列名与 PG 完全一致。故本文件规则大量复用 PostgreSQL 规则思路，按 HGDB 实际 context
#   字段（hgdb_* 前缀）改写。
# - 采集结构来源：plugins/available/hgdb_jdbc/main_plugin.py 的 QUERIES
#   （HgdbJdbcInspector）实际产出的 context 键（已核对，与 UXDB 平行）：
#     hgdb_settings      : SELECT name, setting, unit, category, short_desc, context, source
#                          FROM pg_settings → list[dict]{name, setting, ...}
#     hgdb_connections   : SELECT pid, usename, application_name, client_addr, state, query
#                          FROM pg_stat_activity → list[dict]{pid, usename, state, query}
#     hgdb_lock_waits    : 未授予（NOT granted）的锁等待 → list[dict]{pid, usename, query, locktype, mode}
#     hgdb_tables        : pg_stat_user_tables → list[dict]{n_live_tup, n_dead_tup, ...}
#     hgdb_roles         : pg_roles → list[dict]{rolname, rolsuper, ...}
#     hgdb_wal_level     : SHOW wal_level → [{'wal_level': '<str>'}]
#     hgdb_archive_mode  : SHOW archive_mode → [{'archive_mode': '<str>'}]
#     hgdb_shared_buffers: SHOW shared_buffers → [{'shared_buffers': '<str 如 128MB>'}]
#     hgdb_auth_settings : SHOW password_encryption → [{'password_encryption': '<str>'}]
#     system_info        : 巡检器统一补充（含 memory.usage_percent / disk_list）
#
# - 标量 GUC 采用「专用单值 SHOW 查询」优先策略：
#     wal_level / archive_mode / password_encryption / shared_buffers 这四项的 condition
#     直接引用各自专用 key（hgdb_wal_level / hgdb_archive_mode / hgdb_auth_settings /
#     hgdb_shared_buffers），返回结构为干净的 list[dict]（单键单值），避免任何「在
#     SHOW ALL 里找某参数但采集缺失/列名差异」导致的永不触发问题。
#     max_connections / max_wal_senders 已核实确实存在于 pg_settings，故保留在 hgdb_settings
#     中按 name/setting 提取（与 PG 思路一致）。
# - condition 为规则引擎沙箱表达式（支持 any/len/sum/_int/str 及 .get()/.lower()/.strip()
#   等白名单方法）；params 用 ${context.xxx} 注入，condition 中裸写该变量名即可。
# - 本文件规则沿用 pro/rules/builtin/uxdb.yaml（同为 PG 兼容系）的全部 12 条规则思路，
#   仅将 context 键由 uxdb_* 替换为 hgdb_*、id 加 hgdb_ 前缀，fix_sql 改回标准 PG 写法。
rules:
  # ── 连接数 / 最大连接 ──
  - id: hgdb_max_conn_low
    name: 最大连接数偏小
    name_zh: 最大连接数偏小
    category: connection
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: max_connections 小于 100，会限制并发吞吐
    description_zh: max_connections 小于 100，会限制并发吞吐
    # 已连真库核实：pg_settings 含 max_connections（setting 为字符串，如 '100'），
    # 故在 hgdb_settings 中按 name/setting 提取，_int 解析后比较。
    condition: "any(s.get('name') == 'max_connections' and _int(s.get('setting')) < 100 for s in hgdb_settings)"
    params:
      hgdb_settings: "${context.hgdb_settings}"
    message: "HGDB max_connections 小于 100，过小会限制并发吞吐，建议调大"
    message_zh: "HGDB max_connections 小于 100，过小会限制并发吞吐，建议调大"
    fix_sql: "ALTER SYSTEM SET max_connections = 200;  -- 修改后需重启 HGDB"

  - id: hgdb_conn_high
    name: 活跃会话数过高
    name_zh: 活跃会话数过高
    category: connection
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 当前会话数超过 150，可能存在连接风暴或连接泄漏
    description_zh: 当前会话数超过 150，可能存在连接风暴或连接泄漏
    condition: "conn_count > 150"
    params:
      conn_count: "${len(context.hgdb_connections)}"
    message: "HGDB 当前会话数达 {conn_count}，接近/超过上限，可能存在连接风暴或泄漏"
    message_zh: "HGDB 当前会话数达 {conn_count}，接近/超过上限，可能存在连接风暴或泄漏"
    fix_sql: "排查应用连接池配置；必要时调大 max_connections 并引入连接池（如 PgBouncer）"

  - id: hgdb_idle_in_transaction
    name: 存在空闲事务
    name_zh: 存在空闲事务（idle in transaction）
    category: connection
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 存在 idle in transaction 状态的会话，长期持有会阻塞 VACUUM 与锁
    description_zh: 存在 idle in transaction 状态的会话，长期持有会阻塞 VACUUM 与锁
    condition: "any(str(c.get('state')).lower() == 'idle in transaction' for c in hgdb_connections)"
    params:
      hgdb_connections: "${context.hgdb_connections}"
    message: "存在处于 idle in transaction 状态的会话，长期持有会阻塞 VACUUM 与锁等待"
    message_zh: "存在处于 idle in transaction 状态的会话，长期持有会阻塞 VACUUM 与锁等待"
    fix_sql: "定位并终止空闲事务：\nSELECT pid FROM pg_catalog.pg_stat_activity WHERE state = 'idle in transaction';\nSELECT pg_cancel_backend(pid);"

  # ── 内存配置 ──
  - id: hgdb_shared_buffers_zero
    name: 共享缓冲区未配置或过小
    name_zh: 共享缓冲区未配置或过小
    category: memory
    db_types: [hgdb]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: shared_buffers 未配置或过小（为空/0），缓存命中率低
    description_zh: shared_buffers 未配置或过小（为空/0），缓存命中率低
    # 改用专用查询 hgdb_shared_buffers（SHOW shared_buffers），
    # 返回 [{'shared_buffers': '<str 如 128MB>'} ]；值均为字符串，判空/0 即视为未配置。
    condition: "any(str(r.get('shared_buffers','')).strip().lower() in ('', '0', '0b', '0kb', '0mb', '0gb') for r in hgdb_shared_buffers)"
    params:
      hgdb_shared_buffers: "${context.hgdb_shared_buffers}"
    message: "shared_buffers 未配置或过小（建议设为物理内存的 25% 左右），将显著降低缓存命中率"
    message_zh: "shared_buffers 未配置或过小（建议设为物理内存的 25% 左右），将显著降低缓存命中率"
    fix_sql: "ALTER SYSTEM SET shared_buffers = '4GB';  -- 修改后需重启 HGDB"

  # ── 备份与恢复 ──
  - id: hgdb_wal_level_minimal
    name: WAL 级别为 minimal
    name_zh: WAL 级别为 minimal
    category: backup
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: wal_level 为 minimal，无法支持流复制与时间点恢复（PITR）
    description_zh: wal_level 为 minimal，无法支持流复制与时间点恢复（PITR）
    # 改用专用查询 hgdb_wal_level（SHOW wal_level），返回 [{'wal_level': '<str>'} ]。
    condition: "any(str(r.get('wal_level','')).lower() == 'minimal' for r in hgdb_wal_level)"
    params:
      hgdb_wal_level: "${context.hgdb_wal_level}"
    message: "wal_level 为 minimal，无法支持流复制与时间点恢复（PITR），存在数据安全风险"
    message_zh: "wal_level 为 minimal，无法支持流复制与时间点恢复（PITR），存在数据安全风险"
    fix_sql: "ALTER SYSTEM SET wal_level = replica;  -- 修改后需重启 HGDB"

  - id: hgdb_archive_off
    name: WAL 归档未开启
    name_zh: WAL 归档未开启
    category: backup
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: archive_mode 为 off，未开启 WAL 归档，无法做基于时间点的恢复
    description_zh: archive_mode 为 off，未开启 WAL 归档，无法做基于时间点的恢复
    # 改用专用查询 hgdb_archive_mode（SHOW archive_mode），返回 [{'archive_mode': '<str>'} ]。
    condition: "any(str(r.get('archive_mode','')).lower() == 'off' for r in hgdb_archive_mode)"
    params:
      hgdb_archive_mode: "${context.hgdb_archive_mode}"
    message: "archive_mode 为 off，未开启 WAL 归档，无法实现基于时间点的恢复（PITR）"
    message_zh: "archive_mode 为 off，未开启 WAL 归档，无法实现基于时间点的恢复（PITR）"
    fix_sql: "ALTER SYSTEM SET archive_mode = on;\n-- 同时配置 archive_command，例如：\n-- archive_command = 'test ! -f /mnt/wal/%f && cp %p /mnt/wal/%f'\n-- 修改后需重启 HGDB"

  - id: hgdb_max_wal_senders_low
    name: 流复制发送进程数偏少
    name_zh: 流复制发送进程数偏少
    category: backup
    db_types: [hgdb]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: max_wal_senders 小于 3，难以支撑多备库 + 归档
    description_zh: max_wal_senders 小于 3，难以支撑多备库 + 归档
    # 已连真库核实：pg_settings 含 max_wal_senders（setting 为字符串，如 '10'），保留在 hgdb_settings。
    condition: "any(s.get('name') == 'max_wal_senders' and _int(s.get('setting')) < 3 for s in hgdb_settings)"
    params:
      hgdb_settings: "${context.hgdb_settings}"
    message: "max_wal_senders 小于 3，难以支撑多备库 + 归档，主备切换风险高"
    message_zh: "max_wal_senders 小于 3，难以支撑多备库 + 归档，主备切换风险高"
    fix_sql: "ALTER SYSTEM SET max_wal_senders = 10;  -- 修改后需重启 HGDB"

  # ── 锁等待 ──
  - id: hgdb_lock_wait
    name: 存在锁等待
    name_zh: 存在锁等待
    category: lock
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: 存在未授予的锁等待，可能导致会话阻塞
    description_zh: 存在未授予的锁等待，可能导致会话阻塞
    condition: "wait_count > 0"
    params:
      wait_count: "${len(context.hgdb_lock_waits)}"
    message: "发现 {wait_count} 个未授予的锁等待，可能导致会话阻塞与业务卡顿"
    message_zh: "发现 {wait_count} 个未授予的锁等待，可能导致会话阻塞与业务卡顿"
    fix_sql: "排查持锁会话并优化：\nSELECT * FROM pg_catalog.pg_locks WHERE NOT granted;\n必要时终止阻塞源头会话：SELECT pg_cancel_backend(pid);"

  # ── 维护 / 性能 ──
  - id: hgdb_dead_tuple_bloat
    name: 表死元组膨胀
    name_zh: 表死元组膨胀
    category: maintenance
    db_types: [hgdb]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 部分表死元组比例偏高，建议 VACUUM/ANALYZE
    description_zh: 部分表死元组比例偏高，建议 VACUUM/ANALYZE
    condition: "any(_int(t.get('n_dead_tup')) > 1000 and _int(t.get('n_dead_tup')) > _int(t.get('n_live_tup')) * 0.2 for t in hgdb_tables)"
    params:
      hgdb_tables: "${context.hgdb_tables}"
    message: "部分表死元组比例偏高（n_dead_tup 远超 n_live_tup），建议 VACUUM/ANALYZE"
    message_zh: "部分表死元组比例偏高（n_dead_tup 远超 n_live_tup），建议 VACUUM/ANALYZE"
    fix_sql: "VACUUM (ANALYZE) schemaname.relname;  -- 替换为实际库表名"

  # ── 安全与权限 ──
  - id: hgdb_password_plain
    name: 密码明文存储
    name_zh: 密码加密方式为明文
    category: security
    db_types: [hgdb]
    severity: high
    priority: high
    owner: DBA
    enabled: true
    description: password_encryption 为 plain，密码以明文存储，存在严重安全风险
    description_zh: password_encryption 为 plain，密码以明文存储，存在严重安全风险
    # 改用专用查询 hgdb_auth_settings（SHOW password_encryption），返回 [{'password_encryption': '<str>'} ]。
    condition: "any(str(r.get('password_encryption','')).lower() == 'plain' for r in hgdb_auth_settings)"
    params:
      hgdb_auth_settings: "${context.hgdb_auth_settings}"
    message: "password_encryption 为 plain，密码以明文存储，存在严重安全风险"
    message_zh: "password_encryption 为 plain，密码以明文存储，存在严重安全风险"
    fix_sql: "ALTER SYSTEM SET password_encryption = 'scram-sha-256';  -- 修改后需重启并使现有用户重新设密"

  - id: hgdb_superuser_many
    name: 超级用户过多
    name_zh: 超级用户数量过多
    category: security
    db_types: [hgdb]
    severity: medium
    priority: medium
    owner: DBA
    enabled: true
    description: 存在多个超级用户（rolsuper=true），权限过大，建议收敛
    description_zh: 存在多个超级用户（rolsuper=true），权限过大，建议收敛
    condition: "sum(1 for r in hgdb_roles if r.get('rolsuper')) > 1"
    params:
      hgdb_roles: "${context.hgdb_roles}"
    message: "存在多个超级用户（rolsuper=true），权限过大，建议收敛"
    message_zh: "存在多个超级用户（rolsuper=true），权限过大，建议收敛"
    fix_sql: "复核超级用户必要性；对非必要账号回收超级权限：\nALTER ROLE username NOSUPERUSER;"

  # ── 系统资源（与 PG / Oracle 规则同思路，system_info 由巡检器统一补充）──
  - id: hgdb_mem_usage_high
    name: 系统内存使用率过高
    name_zh: 系统内存使用率过高
    category: system
    db_types: [hgdb]
    severity: high
    priority: high
    owner: 系统管理员
    enabled: true
    description: 系统内存使用率超过 90%
    description_zh: 系统内存使用率超过 90%
    condition: "mem_usage > 90"
    params:
      mem_usage: "${context.system_info.memory.usage_percent}"
    message: "系统内存使用率 {mem_usage:.1f}%，超过 90% 可能触发 OOM 并影响 HGDB"
    message_zh: "系统内存使用率 {mem_usage:.1f}%，超过 90% 可能触发 OOM 并影响 HGDB"
    fix_sql: ""
