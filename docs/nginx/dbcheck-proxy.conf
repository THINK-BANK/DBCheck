# =============================================================
# DBCheck 反向代理配置（方案 A：子域名 / 独立端口，应用零改动）
# -------------------------------------------------------------
# 适用前提（已核对源码）：
#   - DBCheck Web 监听 0.0.0.0:5003（modules/web/app.py:9687 / cli.py:284）
#   - 前端全部使用根绝对路径 /api/ /static/ /icons/ /socket.io/
#   - SocketIO cors_allowed_origins='*'，客户端连默认 /socket.io/ 路径
# 因此只要在「根」上反代（不加子路径前缀），应用看到的请求路径与
# 写死的一致，无需改动任何应用代码。所有「折腾」都来自子路径反代。
#
# 使用方式：
#   1) 把本文件 include 进 nginx（如 /etc/nginx/conf.d/dbcheck.conf）
#   2) 按需选择下方「变体一」或「变体二」，删掉另一个 server 块
#   3) nginx -t && systemctl reload nginx
# =============================================================

# 后端 upstream：指向本机 DBCheck 进程
# 若 DBCheck 跑在另一台机器/容器，把 127.0.0.1 换成其可达地址
upstream dbcheck_backend {
    server 127.0.0.1:5003;
    # server 10.0.0.5:5003;   # 容器/其它主机场景
    keepalive 32;
}

# -------------------- 变体一：子域名（推荐）--------------------
# 例：dbcheck.example.com  →  浏览器访问 http(s)://dbcheck.example.com/
# 访问 https://dbcheck.example.com/api/xxx 会被 nginx 在「根」转发给 5003，
# 与前端写死的 /api/ 完全对应，无 404、无代理不到的接口。
server {
    listen 80;
    server_name dbcheck.example.com;   # ← 改成你的域名

    # 有证书时建议全站跳转 HTTPS（无证书可删掉下面 3 行，仅用 80）
    # return 301 https://$host$request_uri;

    # 如需 HTTPS，取消注释并填入证书路径：
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/dbcheck.example.com/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/dbcheck.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # 基础代理头
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 普通 HTTP 请求（页面 /api /static /icons 等）
    # 关键：proxy_pass 以 / 结尾 → 在「根」转发，不再叠加任何前缀
    location / {
        proxy_pass http://dbcheck_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;   # 让流式响应（如 AI 诊断）即时下发
    }

    # SocketIO 实时通道（实时监控 / AI 诊断流式推送）
    # 必须放行 WebSocket 的 Upgrade，否则连接会被 nginx 断掉
    location /socket.io/ {
        proxy_pass http://dbcheck_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # 长连推送，超时设大
        proxy_buffering off;
    }
}

# -------------------- 变体二：独立端口 --------------------
# 例：http://<服务器IP>:8080  →  不与其它服务抢 80 端口
# 适合内网/测试，或同一台机器上和 Nginx 托管的主站并存
server {
    listen 8080;
    server_name _;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://dbcheck_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://dbcheck_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# =============================================================
# 安全加固（可选，视场景）
# -------------------------------------------------------------
# 1) 由于 DBCheck 绑定 0.0.0.0:5003，绕过 nginx 直连 5003 仍可访问。
#    若仅允许经 nginx 访问，用防火墙只放行进 5003 的 nginx 本机流量：
#      Linux:  iptables -A INPUT -p tcp --dport 5003 ! -s 127.0.0.1 -j DROP
#      Windows: netsh advfirewall 入站规则 仅允许 127.0.0.1
#    （如需让应用只监听 127.0.0.1 需改 app.py 的 host 参数，属代码改动，非方案 A 范畴）
#
# 2) 登录态：app.py 用 Flask 会话 cookie（重启后失效，生产可固定密钥保持登录）。
#    方案 A 同源，cookie 正常下发，无需额外处理。
#
# 3) 若应用后续依赖 request.scheme/client_ip 生成绝对链接（如邮件/通知），
#    可在 app.py 顶部加 werkzeug.middleware.proxy_fix.ProxyFix 信任上述
#    X-Forwarded-* 头，但当前功能（页面/接口/实时推送）不依赖它，可暂缓。
# =============================================================
